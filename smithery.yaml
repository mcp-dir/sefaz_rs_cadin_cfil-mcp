# Smithery configuration for SEFAZ RS: CADIN e CFIL
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_sefaz_rs_cadin_cfil

name: sefaz_rs_cadin_cfil-mcp
displayName: "SEFAZ RS: CADIN e CFIL"
description: >
  SEFAZ RS: CADIN e CFIL, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/sefaz_rs_cadin_cfil-mcp
repository: https://github.com/mcp-dir/sefaz_rs_cadin_cfil-mcp

tags:
  - sefaz_rs_cadin_cfil
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_sefaz_rs_cadin_cfil

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_sefaz_rs_cadin_cfil/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
